<line x1="610.0" y1="260" x2="610.0" y2="265" stroke="black"/><text x="602.0" y="280">40%</text>
<line x1="675.0" y1="260" x2="675.0" y2="265" stroke="black"/><text x="667.0" y="280">50%</text>
<line x1="740.0" y1="260" x2="740.0" y2="265" stroke="black"/><text x="732.0" y="280">60%</text>
<line x1="610.0" y1="40" x2="610.0" y2="260" stroke="#2c7fb8" stroke-dasharray="5,4"/><text x="540.0" y="55" fill="#2c7fb8">base rate 40.0%</text>
